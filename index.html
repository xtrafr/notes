<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <meta name="description" content="A beautiful, minimalist notes app that lives in your browser">
  <meta name="author" content="Xtra">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="website.ico">
  <title>Notes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #ffffff;
      --bg-secondary: #f8f9fa;
      --bg-elevated: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #6b7280;
      --text-tertiary: #9ca3af;
      --border: #e5e7eb;
      --border-light: #f3f4f6;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-light: #dbeafe;
      --success: #10b981;
      --warning: #f59e0b;
      --error: #ef4444;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      --radius: 12px;
      --radius-sm: 8px;
      --radius-lg: 16px;
      --radius-xl: 24px;
      --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --bg-secondary: #111111;
        --bg-elevated: #1a1a1a;
        --text: #f9fafb;
        --text-secondary: #d1d5db;
        --text-tertiary: #9ca3af;
        --border: #374151;
        --border-light: #1f2937;
        --accent: #3b82f6;
        --accent-hover: #60a5fa;
        --accent-light: #1e3a8a;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.25);
        --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.3), 0 1px 2px -1px rgb(0 0 0 / 0.3);
        --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.3), 0 4px 6px -4px rgb(0 0 0 / 0.3);
        --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.4), 0 8px 10px -6px rgb(0 0 0 / 0.4);
      }
    }

    html {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      font-size: 16px;
      line-height: 1.6;
      color-scheme: light dark;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      background: linear-gradient(135deg, var(--bg) 0%, var(--bg-secondary) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 20% 80%, var(--accent-light) 0%, transparent 50%),
                  radial-gradient(circle at 80% 20%, var(--accent-light) 0%, transparent 50%);
      opacity: 0.3;
      pointer-events: none;
      z-index: -1;
    }


    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      font-size: 0.875rem;
      font-weight: 600;
      line-height: 1;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: var(--shadow);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-xl);
    }

    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .btn-secondary:hover {
      background: var(--border-light);
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      padding: 0.5rem;
    }

    .btn-ghost:hover {
      background: var(--bg-secondary);
      color: var(--text);
    }

    .btn-icon {
      width: 36px;
      height: 36px;
      padding: 0;
    }

    /* Toolbar */
    .toolbar {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 0.5rem;
      margin-bottom: 1rem;
      display: flex;
      gap: 0.25rem;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
      position: sticky;
      top: 20px;
      z-index: 90;
    }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      padding: 0;
      background: var(--bg-secondary);
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      color: var(--text-secondary);
      cursor: pointer;
      transition: var(--transition);
      position: relative;
    }

    .toolbar-btn:hover {
      background: var(--accent);
      color: white;
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
    }

    .toolbar-btn:active {
      transform: translateY(0);
    }

    .toolbar-btn.active {
      background: var(--accent);
      color: white;
    }

    .toolbar-btn svg {
      width: 20px;
      height: 20px;
    }

    .toolbar-separator {
      width: 1px;
      background: var(--border);
      margin: 0 0.5rem;
      align-self: stretch;
    }

    .toolbar-tooltip {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.375rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
      box-shadow: var(--shadow-lg);
      z-index: 1000;
    }

    .toolbar-btn:hover .toolbar-tooltip {
      opacity: 1;
    }

    /* Main Content */
    .main {
      flex: 1;
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      padding: 2rem 1.5rem;
    }

    /* Editor Container */
    .editor-container {
      position: relative;
      min-height: 70vh;
    }

    /* WYSIWYG Editor */
    .editor {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      padding: 2rem;
      min-height: 70vh;
      font-size: 1.125rem;
      line-height: 1.75;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      box-shadow: var(--shadow-lg);
      overflow-y: auto;
    }

    
    .editor:empty::before {
      content: 'Start typing your note...';
      color: var(--text-tertiary);
      pointer-events: none;
    }

    /* Editor content styles */
    .editor h1 { font-size: 2rem; font-weight: 700; margin: 1.5rem 0 1rem; }
    .editor h2 { font-size: 1.5rem; font-weight: 600; margin: 1.25rem 0 0.75rem; }
    .editor h3 { font-size: 1.25rem; font-weight: 600; margin: 1rem 0 0.5rem; }
    .editor p { margin: 0.75rem 0; }
    .editor ul, .editor ol { margin: 0.75rem 0; padding-left: 1.5rem; }
    .editor li { margin: 0.25rem 0; }
    .editor blockquote {
      border-left: 4px solid var(--accent);
      padding-left: 1rem;
      margin: 1rem 0;
      color: var(--text-secondary);
      font-style: italic;
    }
    .editor code {
      background: var(--accent-light);
      color: var(--accent);
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      font-family: 'SF Mono', Monaco, Consolas, monospace;
      font-size: 0.875em;
    }
    .editor a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .editor hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 1.5rem 0;
    }

    /* Markdown Styles */
    .md-h1 {
      font-size: 2.25rem;
      font-weight: 700;
      line-height: 1.2;
      margin: 2rem 0 1rem;
      color: var(--text);
    }

    .md-h2 {
      font-size: 1.875rem;
      font-weight: 600;
      line-height: 1.3;
      margin: 1.75rem 0 0.75rem;
      color: var(--text);
    }

    .md-h3 {
      font-size: 1.5rem;
      font-weight: 600;
      line-height: 1.3;
      margin: 1.5rem 0 0.5rem;
      color: var(--text);
    }

    .md-h4 {
      font-size: 1.25rem;
      font-weight: 600;
      line-height: 1.4;
      margin: 1.25rem 0 0.5rem;
      color: var(--text);
    }

    .md-h5 {
      font-size: 1.125rem;
      font-weight: 600;
      line-height: 1.4;
      margin: 1rem 0 0.5rem;
      color: var(--text);
    }

    .md-h6 {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.5;
      margin: 1rem 0 0.5rem;
      color: var(--text-secondary);
    }

    .md-p {
      margin: 1rem 0;
    }

    .md-code {
      background: var(--accent-light);
      color: var(--accent);
      padding: 0.125rem 0.375rem;
      border-radius: 4px;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
      font-size: 0.875em;
    }

    .md-codeblock {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem;
      margin: 1.5rem 0;
      overflow-x: auto;
      font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, monospace;
      font-size: 0.875rem;
    }

    .md-bold {
      font-weight: 600;
    }

    .md-italic {
      font-style: italic;
    }

    .md-strike {
      text-decoration: line-through;
    }

    .md-url {
      color: var(--accent);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
      transition: var(--transition);
    }

    .md-url:hover {
      color: var(--accent-hover);
    }

    /* Menu */
    .menu {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 0.5rem;
      box-shadow: var(--shadow-xl);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 200px;
      opacity: 0;
      transform: translateY(10px) scale(0.95);
      pointer-events: none;
      transition: var(--transition);
      z-index: 1000;
    }

    .menu.visible {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-sm);
      color: var(--text);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
      transition: var(--transition);
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
      text-align: left;
    }

    .menu-item:hover {
      background: var(--bg-secondary);
      transform: translateX(2px);
    }

    .menu-item svg {
      width: 18px;
      height: 18px;
      opacity: 0.7;
    }

    /* FAB */
    .fab {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      width: 64px;
      height: 64px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: var(--shadow-xl);
      transition: var(--transition);
      z-index: 999;
    }

    .fab:hover {
      background: var(--accent-hover);
      transform: scale(1.1) rotate(90deg);
      box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.5);
    }

    .fab svg {
      width: 28px;
      height: 28px;
      transition: var(--transition);
    }

    .fab.active svg {
      transform: rotate(45deg);
    }

    /* Toast */
    .toast {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
      box-shadow: var(--shadow-lg);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      opacity: 0;
      transform: translateY(-10px);
      pointer-events: none;
      transition: var(--transition);
      z-index: 1001;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .toast-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .toast.success .toast-icon {
      color: var(--success);
    }

    .toast.error .toast-icon {
      color: var(--error);
    }

    .toast-message {
      font-size: 0.875rem;
      font-weight: 500;
    }

    /* Loading */
    .loading {
      position: relative;
      pointer-events: none;
      opacity: 0.6;
    }

    .loading::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 32px;
      height: 32px;
      margin: -16px 0 0 -16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 768px) {
      .main {
        padding: 1rem;
        padding-top: 2rem;
      }

      .editor {
        padding: 2rem;
        font-size: 1rem;
        min-height: 60vh;
      }

      .fab {
        bottom: 1rem;
        right: 1rem;
        width: 48px;
        height: 48px;
      }

      .menu {
        bottom: 1rem;
        right: 1rem;
      }

      .toast {
        top: 1rem;
        right: 1rem;
        left: 1rem;
      }

      .btn-text {
        display: none;
      }
    }

    /* Print */
    @media print {
      .fab,
      .menu,
      .toast {
        display: none !important;
      }

      .editor {
        border: none;
        box-shadow: none;
        padding: 0;
      }
    }

    /* Accessibility */
    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    .focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: var(--transition);
      z-index: 2000;
      padding: 1rem;
    }
    .modal-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .modal {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 1.5rem;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow-xl);
      transform: translateY(20px) scale(0.95);
      transition: var(--transition);
      color: var(--text);
    }
    .modal-overlay.visible .modal {
      transform: translateY(0) scale(1);
    }
    .modal-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .modal-body {
      margin-bottom: 1.5rem;
      color: var(--text-secondary);
      font-size: 0.875rem;
      line-height: 1.5;
    }
    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: var(--transition);
      margin-top: 0.5rem;
      font-family: inherit;
    }
    .input-field:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    
    /* Status Bar */
    .status-bar {
      border-top: 1px solid var(--border);
      padding: 0.5rem 1.5rem;
      display: flex;
      justify-content: flex-start;
      gap: 1.5rem;
      color: var(--text-tertiary);
      font-size: 0.75rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      border-bottom-left-radius: var(--radius-xl);
      border-bottom-right-radius: var(--radius-xl);
      background: var(--bg-secondary);
      opacity: 0.8;
    }

    .editor-container {
      display: flex;
      flex-direction: column;
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .editor {
      border: none;
      box-shadow: none;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      min-height: calc(70vh - 40px);
    }
  </style>
</head>
<body>

  <!-- Main Content -->
  <main class="main">
    <!-- Formatting Toolbar -->
    <div class="toolbar">
      <button class="toolbar-btn" data-action="bold" title="Bold (Ctrl+B)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 4h8a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
          <path d="M6 12h9a4 4 0 0 1 4 4 4 4 0 0 1-4 4H6z"></path>
        </svg>
        <span class="toolbar-tooltip">Bold</span>
      </button>
      
      <button class="toolbar-btn" data-action="italic" title="Italic (Ctrl+I)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="4" x2="10" y2="4"></line>
          <line x1="14" y1="20" x2="5" y2="20"></line>
          <line x1="15" y1="4" x2="9" y2="20"></line>
        </svg>
        <span class="toolbar-tooltip">Italic</span>
      </button>
      
      <button class="toolbar-btn" data-action="underline" title="Underline (Ctrl+U)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"></path>
          <line x1="4" y1="21" x2="20" y2="21"></line>
        </svg>
        <span class="toolbar-tooltip">Underline</span>
      </button>
      
      <button class="toolbar-btn" data-action="strike" title="Strikethrough">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <path d="M16 8.5c0-2.5-2-4.5-4.5-4.5S7 6 7 8.5c0 1 .5 1.5 1 2"></path>
          <path d="M7 15.5c0 2.5 2 4.5 4.5 4.5s4.5-2 4.5-4.5c0-1-.5-1.5-1-2"></path>
        </svg>
        <span class="toolbar-tooltip">Strikethrough</span>
      </button>
      
      <div class="toolbar-separator"></div>
      
      <button class="toolbar-btn" data-action="h1" title="Heading 1">
        <span style="font-weight: 700; font-size: 16px;">H1</span>
        <span class="toolbar-tooltip">Heading 1</span>
      </button>
      
      <button class="toolbar-btn" data-action="h2" title="Heading 2">
        <span style="font-weight: 600; font-size: 14px;">H2</span>
        <span class="toolbar-tooltip">Heading 2</span>
      </button>
      
      <button class="toolbar-btn" data-action="h3" title="Heading 3">
        <span style="font-weight: 600; font-size: 12px;">H3</span>
        <span class="toolbar-tooltip">Heading 3</span>
      </button>
      
      <div class="toolbar-separator"></div>
      
      <button class="toolbar-btn" data-action="code" title="Inline Code">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16,18 22,12 16,6"></polyline>
          <polyline points="8,6 2,12 8,18"></polyline>
        </svg>
        <span class="toolbar-tooltip">Inline Code</span>
      </button>

      <button class="toolbar-btn" data-action="codeblock" title="Code Block">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="9" y1="9" x2="15" y2="15"></line>
          <line x1="15" y1="9" x2="9" y2="15"></line>
        </svg>
        <span class="toolbar-tooltip">Code Block</span>
      </button>
      
      <div class="toolbar-separator"></div>
      
      <button class="toolbar-btn" data-action="ul" title="Bullet List">

  <script>
    // Version: 1.1.0
    class NotesApp {
      constructor() {
        this.editor = document.querySelector('.editor');
        this.toolbar = document.querySelector('.toolbar');
        this.menu = document.querySelector('.menu');
        this.fab = document.querySelector('.fab');
        this.toast = document.querySelector('.toast');
        this.saveTimeout = null;
        this.init();
      }

      async init() {
        this.setupEditor();
        this.setupToolbar();
        this.setupEvents();
        await this.load();
        this.registerServiceWorker();
        console.log('Notes loaded');
      }

      setupEditor() {
        this.editor.contentEditable = 'true';
        this.editor.spellcheck = true;

        this.editor.addEventListener('paste', (e) => {
          e.preventDefault();
          document.execCommand('insertText', false, e.clipboardData.getData('text/plain'));
        });

        this.editor.addEventListener('keydown', (e) => {
          if (e.ctrlKey || e.metaKey) {
            switch (e.key.toLowerCase()) {
              case 'b': e.preventDefault(); this.format('bold'); break;
              case 'i': e.preventDefault(); this.format('italic'); break;
              case 'u': e.preventDefault(); this.format('underline'); break;
              case 'k': e.preventDefault(); this.format('link'); break;
              case 's': e.preventDefault(); this.download('html'); break;
            }
          }
        });
      }

      setupToolbar() {
        this.toolbar.querySelectorAll('[data-action]').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.preventDefault();
            this.format(btn.dataset.action);
            this.updateToolbarState();
          });
        });
        document.addEventListener('selectionchange', () => this.updateToolbarState());
      }

      setupEvents() {
        this.editor.addEventListener('input', () => {
          this.debouncedSave();
          this.updateCounts();
        });
        this.editor.addEventListener('blur', () => this.save());
        window.addEventListener('hashchange', () => this.load());
        document.addEventListener('click', (e) => {
          if (!e.target.closest('.menu') && !e.target.closest('.fab')) this.hideMenu();
        });
      }

      updateCounts() {
        const text = this.editor.innerText || '';
        const chars = text.length;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        document.getElementById('char-count').textContent = `${chars} chars`;
        document.getElementById('word-count').textContent = `${words} words`;
      }

      format(action) {
        this.editor.focus();
        switch (action) {
          case 'bold': document.execCommand('bold'); break;
          case 'italic': document.execCommand('italic'); break;
          case 'underline': document.execCommand('underline'); break;
          case 'strike': document.execCommand('strikeThrough'); break;
          case 'h1': document.execCommand('formatBlock', false, '<h1>'); break;
          case 'h2': document.execCommand('formatBlock', false, '<h2>'); break;
          case 'h3': document.execCommand('formatBlock', false, '<h3>'); break;
          case 'ul': document.execCommand('insertUnorderedList'); break;
          case 'ol': document.execCommand('insertOrderedList'); break;
          case 'quote': document.execCommand('formatBlock', false, '<blockquote>'); break;
          case 'code': this.toggleCode(); break;
          case 'codeblock': document.execCommand('formatBlock', false, '<pre>'); break;
          case 'link': this.insertLink(); break;
          case 'hr': document.execCommand('insertHorizontalRule'); break;
          case 'share': this.share(); break;
          case 'new': this.newNote(); break;
        }
        this.updateToolbarState();
      }

      toggleCode() {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const range = sel.getRangeAt(0);
        const text = range.toString();
        if (!text) return;

        let node = sel.anchorNode;
        while (node && node !== this.editor) {
          if (node.nodeName === 'CODE') {
            node.parentNode.replaceChild(document.createTextNode(node.textContent), node);
            return;
          }
          node = node.parentNode;
        }

        const code = document.createElement('code');
        try { range.surroundContents(code); }
        catch { 
          const safeText = this.escapeHtml(text);
          document.execCommand('insertHTML', false, `<code>${safeText}</code>`); 
        }
      }

      insertLink() {
        const text = window.getSelection().toString();
        const url = prompt('URL:', 'https://');
        if (!url) return;
        
        // Validate URL to prevent XSS
        const sanitizedUrl = this.sanitizeUrl(url);
        if (!sanitizedUrl) {
          this.showToast('Invalid URL', 'error');
          return;
        }
        
        if (text) {
          document.execCommand('createLink', false, sanitizedUrl);
          this.editor.querySelectorAll(`a[href="${sanitizedUrl}"]`).forEach(a => {
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
          });
        } else {
          const safeText = this.escapeHtml(sanitizedUrl);
          document.execCommand('insertHTML', false, `<a href="${sanitizedUrl}" target="_blank" rel="noopener noreferrer">${safeText}</a>`);
        }
      }

      updateToolbarState() {
        const selection = window.getSelection();
        const hasSelection = selection && selection.toString().trim().length > 0;
        const hasContent = this.editor.textContent.trim().length > 0;
        
        const map = { bold: 'bold', italic: 'italic', underline: 'underline', strike: 'strikeThrough', ul: 'insertUnorderedList', ol: 'insertOrderedList' };
        for (const [action, cmd] of Object.entries(map)) {
          const btn = this.toolbar.querySelector(`[data-action="${action}"]`);
          if (btn) {
            const isActive = hasSelection && document.queryCommandState(cmd);
            btn.classList.toggle('active', isActive);
          }
        }
      }

      async compress(str) {
        const s = new CompressionStream('deflate-raw');
        const w = s.writable.getWriter();
        w.write(new TextEncoder().encode(str));
        w.close();
        return new Uint8Array(await new Response(s.readable).arrayBuffer()).toBase64({ alphabet: 'base64url' });
      }

      async decompress(b64) {
        try {
          const s = new DecompressionStream('deflate-raw');
          const w = s.writable.getWriter();
          w.write(Uint8Array.fromBase64(b64, { alphabet: 'base64url' }));
          w.close();
          return new TextDecoder().decode(await new Response(s.readable).arrayBuffer());
        } catch { return ''; }
      }

      async load() {
        try {
          if (!location.hash || location.hash === '#') {
            this.editor.innerHTML = '';
            localStorage.removeItem('notes-content');
            this.updateTitle();
            this.updateCounts();
            return;
          }
          
          let payload = location.hash.slice(1);
          this.isReadOnly = false;
          this.isEncrypted = false;
          
          if (payload.startsWith('r:')) {
            this.isReadOnly = true;
            payload = payload.slice(2);
          }
          if (payload.startsWith('e:')) {
            this.isEncrypted = true;
            payload = payload.slice(2);
          }
          
          if (this.isReadOnly) {
            this.editor.contentEditable = 'false';
            this.toolbar.style.display = 'none';
          } else {
            this.editor.contentEditable = 'true';
            this.toolbar.style.display = 'flex';
          }

          if (this.isEncrypted) {
            const password = await this.askPassword("Unlock Note", "This note is encrypted end-to-end. Enter password to unlock.");
            if (!password) {
               this.editor.innerHTML = '<div style="text-align:center; padding: 2rem; color: var(--text-secondary);">Note is encrypted. Reload to unlock.</div>';
               return;
            }
            try {
              payload = await this.decrypt(payload, password);
              this.currentPassword = password;
              this.showToast('Note unlocked');
            } catch (err) {
              this.editor.innerHTML = '<div style="text-align:center; padding: 2rem; color: var(--error);">Incorrect password. Reload to try again.</div>';
              return;
            }
          }
          
          const content = await this.decompress(payload);
          if (content) {
            this.editor.innerHTML = content;
          }
          this.updateTitle();
          this.updateCounts();
        } catch (e) { 
          console.error('Failed to load content:', e);
          this.editor.innerHTML = '';
          this.updateTitle();
        }
      }

      debouncedSave() {
        clearTimeout(this.saveTimeout);
        this.saveTimeout = setTimeout(() => this.save(), 500);
      }

      async save() {
        if (this.isReadOnly) return;
        try {
          const content = this.editor.innerHTML;
          if (!content || content === '<br>' || !content.trim()) {
            localStorage.removeItem('notes-content');
            if (location.hash) history.replaceState({}, '', location.pathname);
            return;
          }
          let hashPayload = await this.compress(content);
          if (this.isEncrypted && this.currentPassword) {
            hashPayload = 'e:' + await this.encrypt(hashPayload, this.currentPassword);
          }
          const hash = '#' + hashPayload;
          if (location.hash !== hash) history.replaceState({}, '', hash);
          localStorage.setItem('notes-content', hash);
          this.updateTitle();
        } catch (e) { console.error(e); }
      }

      updateTitle() {
        document.title = 'Notes';
      }

      toggleMenu() {
        this.menu.classList.toggle('visible');
        this.fab.classList.toggle('active');
      }

      hideMenu() {
        this.menu.classList.remove('visible');
        this.fab.classList.remove('active');
      }

      showToast(msg, type = 'success') {
        this.toast.className = `toast ${type} visible`;
        this.toast.querySelector('.toast-message').textContent = msg;
        setTimeout(() => this.toast.classList.remove('visible'), 3000);
      }

      newNote() {
        if (this.editor.textContent.trim() && !confirm('Start new note?')) return;
        this.editor.innerHTML = '';
        localStorage.removeItem('notes-content');
        history.replaceState({}, '', location.pathname);
        document.title = 'Notes';
        this.editor.focus();
      }

      askShareType() {
        return new Promise(resolve => {
          const modal = document.getElementById('share-modal');
          const readonlyBtn = document.getElementById('share-readonly-btn');
          const editableBtn = document.getElementById('share-editable-btn');
          const cancelBtn = modal.querySelector('.btn-ghost');
          
          modal.classList.add('visible');
          
          const finish = (type) => {
            modal.classList.remove('visible');
            readonlyBtn.onclick = null;
            editableBtn.onclick = null;
            cancelBtn.onclick = null;
            resolve(type);
          };
          
          readonlyBtn.onclick = () => finish('readonly');
          editableBtn.onclick = () => finish('editable');
          cancelBtn.onclick = () => finish(null);
        });
      }

      async share() {
        try {
          const shareType = await this.askShareType();
          if (!shareType) return;
          
          let hash = location.hash;
          if (shareType === 'readonly') {
            let p = hash.slice(1);
            if (p.startsWith('e:')) p = 'r:e:' + p.slice(2);
            else if (!p.startsWith('r:')) p = 'r:' + p;
            hash = '#' + p;
          }
          const shareUrl = location.origin + location.pathname + hash;
          await navigator.clipboard.writeText(shareUrl);
          this.showToast(shareType === 'readonly' ? 'Read-Only Link Copied!' : 'Editable Link Copied!');
        } catch { this.showToast('Copy failed', 'error'); }
      }

      async copyContent() {
        try {
          await navigator.clipboard.writeText(this.editor.textContent);
          this.showToast('Copied!');
        } catch { this.showToast('Copy failed', 'error'); }
      }

      download(format) {
        const title = 'notes';
        if (format === 'html') {
          const content = this.sanitizeHtml(this.editor.innerHTML);
          const html = `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Notes</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:0 auto;padding:2rem;line-height:1.6}code{background:#f5f5f5;padding:.2em .4em;border-radius:3px}blockquote{border-left:4px solid #3b82f6;padding-left:1rem;color:#666}pre{background:#f8f9fa;padding:1rem;border-radius:8px;overflow-x:auto}</style></head><body>${content}</body></html>`;
          this.downloadFile(html, `${title}.html`, 'text/html');
        } else if (format === 'markdown') {
          this.downloadFile(this.htmlToMarkdown(this.editor), `${title}.md`, 'text/markdown');
        } else {
          this.downloadFile(this.editor.textContent, `${title}.txt`, 'text/plain');
        }
        this.showToast(`Downloaded ${format.toUpperCase()}`);
      }

      htmlToMarkdown(element) {
        let md = '';
        const children = element.childNodes;
        for (let i = 0; i < children.length; i++) {
          const child = children[i];
          if (child.nodeType === Node.TEXT_NODE) {
            md += child.textContent;
          } else if (child.nodeType === Node.ELEMENT_NODE) {
            let inner = this.htmlToMarkdown(child);
            switch (child.tagName.toLowerCase()) {
              case 'h1': md += `\n# ${inner}\n\n`; break;
              case 'h2': md += `\n## ${inner}\n\n`; break;
              case 'h3': md += `\n### ${inner}\n\n`; break;
              case 'p': md += `\n${inner}\n\n`; break;
              case 'b': case 'strong': md += `**${inner}**`; break;
              case 'i': case 'em': md += `_${inner}_`; break;
              case 'u': md += `<u>${inner}</u>`; break;
              case 'strike': case 's': case 'del': md += `~~${inner}~~`; break;
              case 'a': md += `[${inner}](${child.href})`; break;
              case 'code': md += `\`${inner}\``; break;
              case 'pre': md += `\n\`\`\`\n${child.textContent}\n\`\`\`\n\n`; break;
              case 'blockquote': md += `\n> ${(' ' + inner).trim().replace(/\n/g, '\n> ')}\n\n`; break;
              case 'ul': case 'ol': md += `\n${inner}\n`; break;
              case 'li': 
                const isOl = child.parentNode && child.parentNode.tagName.toLowerCase() === 'ol';
                const prefix = isOl ? '1. ' : '- ';
                md += `${prefix}${inner}\n`; break;
              case 'hr': md += `\n---\n\n`; break;
              case 'br': md += `\n`; break;
              case 'div': 
                if (child.classList.contains('toolbar') || child.classList.contains('status-bar')) break;
                md += `\n${inner}`; break;
              default: md += inner; break;
            }
          }
        }
        return md.replace(/\n{3,}/g, '\n\n').trim();
      }

      downloadFile(content, name, type) {
        const url = URL.createObjectURL(new Blob([content], { type }));
        Object.assign(document.createElement('a'), { href: url, download: name }).click();
        URL.revokeObjectURL(url);
      }

      registerServiceWorker() {
        if ('serviceWorker' in navigator && location.protocol !== 'file:') {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        }
      }

      sanitizeHtml(html) {
        const div = document.createElement('div');
        div.textContent = html;
        return div.innerHTML;
      }

      escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      sanitizeUrl(url) {
        try {
          if (!url || typeof url !== 'string') return null;
          const trimmedUrl = url.trim();
          if (!trimmedUrl) return null;
          if (trimmedUrl.startsWith('javascript:') || trimmedUrl.startsWith('data:') || trimmedUrl.startsWith('vbscript:') || trimmedUrl.startsWith('file:')) return null;
          if (trimmedUrl.startsWith('http://') || trimmedUrl.startsWith('https://') || trimmedUrl.startsWith('/') || trimmedUrl.startsWith('./') || trimmedUrl.startsWith('../')) return trimmedUrl;
          if (trimmedUrl.includes('.') && !trimmedUrl.includes(' ')) return 'https://' + trimmedUrl;
          return null;
        } catch (e) {
          return null;
        }
      }

      async deriveKey(password, salt) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveBits', 'deriveKey']);
        return await crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
          keyMaterial, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']
        );
      }

      async encrypt(b64Data, password) {
        const salt = crypto.getRandomValues(new Uint8Array(16));
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const key = await this.deriveKey(password, salt);
        const encoded = new TextEncoder().encode(b64Data);
        const encrypted = await crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, encoded);
        
        const bundle = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
        bundle.set(salt, 0);
        bundle.set(iv, salt.length);
        bundle.set(new Uint8Array(encrypted), salt.length + iv.length);
        
        return bundle.toBase64({ alphabet: 'base64url' });
      }

      async decrypt(b64Bundle, password) {
        const bundle = Uint8Array.fromBase64(b64Bundle, { alphabet: 'base64url' });
        const salt = bundle.slice(0, 16);
        const iv = bundle.slice(16, 28);
        const ciphertext = bundle.slice(28);
        
        const key = await this.deriveKey(password, salt);
        const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ciphertext);
        return new TextDecoder().decode(decrypted);
      }

      askPassword(title, body, isSetup = false) {
        return new Promise(resolve => {
          const modal = isSetup ? document.getElementById('set-password-modal') : document.getElementById('password-modal');
          const input = isSetup ? document.getElementById('set-password-input') : document.getElementById('password-input');
          const submitBtn = isSetup ? document.getElementById('set-password-submit') : document.getElementById('password-submit');
          const cancelBtn = document.getElementById('password-cancel');
          const removeBtn = document.getElementById('remove-password-btn');

          if (!isSetup) {
            document.getElementById('password-modal-title').textContent = title;
            document.getElementById('password-modal-body').textContent = body;
          } else {
             if (this.isEncrypted) {
               removeBtn.style.display = 'block';
             } else {
               removeBtn.style.display = 'none';
             }
          }

          input.value = '';
          modal.classList.add('visible');
          input.focus();

          const finish = (val) => {
            modal.classList.remove('visible');
            submitBtn.onclick = null;
            if (cancelBtn) cancelBtn.onclick = null;
            if (removeBtn) removeBtn.onclick = null;
            input.onkeydown = null;
            resolve(val);
          };

          submitBtn.onclick = () => finish(input.value);
          if (cancelBtn) cancelBtn.onclick = () => finish(null);
          if (removeBtn) removeBtn.onclick = () => finish(""); 
          input.onkeydown = (e) => {
            if (e.key === 'Enter') finish(input.value);
            if (e.key === 'Escape' && isSetup) finish(null);
          };
        });
      }

      async showProtectionModal() {
        this.hideMenu();
        const pass = await this.askPassword('', '', true);
        if (pass === null) return;
        if (pass === "") {
          this.isEncrypted = false;
          this.currentPassword = null;
          this.showToast('Password removed');
          this.save();
          return;
        }
        this.isEncrypted = true;
        this.currentPassword = pass;
        this.showToast('Note encrypted');
        this.save();
      }
    }

    document.addEventListener('DOMContentLoaded', () => window.app = new NotesApp());
  </script>
</body>
</html>
